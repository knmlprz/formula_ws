services:
  jetson_ws:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: jetson-ros-humble:local
    container_name: jetson-ros-humble
    working_dir: /jetson_ws
    network_mode: "host"
    privileged: true
    runtime: nvidia
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    #   - "/dev/i2c-1:/dev/i2c-1"
    stdin_open: true
    tty: true
    ipc: host
    pid: host
    entrypoint: [""]
    command:
      - /bin/bash
      - -c
      - |
        set -ex
        echo "START-MARKER"
        source /opt/ros/humble/setup.bash
        colcon build
        echo 'source /opt/ros/humble/setup.bash' >> ~/.bashrc
        echo 'source /jetson_ws/install/setup.bash' >> ~/.bashrc
        tail -f /dev/null