- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"
  
# DISABLED: joint_states bridge
# Reason: Conflict prevention. In a ros2_control architecture, joint states
# must be published exclusively by the 'joint_state_broadcaster' controller
# (Single Source of Truth). Enabling this bridge causes duplicate/conflicting
# messages on the /joint_states topic from Gazebo, which breaks the TF tree.
# Passive joints (like unactuated front wheels) have been added directly to
# the ros2_control hardware interface in the URDF instead.

# DEFAULT CAMERA
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS


