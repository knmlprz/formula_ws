ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    print_diagnostics: true
    history_length: 0.0
    permit_corrected_publication: true
    smooth_lagged_data: false

    # Odometria z kontrolera kół
    odom0: /odom
    odom0_config: [false, false, false,  # X, Y, Z (wyłączone absolutne wartości)
                      false, false, false,  # roll, pitch, yaw (wyłączone)
                      true,  false, false,  # vx (WŁĄCZONE), vy, vz
                      false, false, true,   # vroll, vpitch, vyaw (WŁĄCZONE prędkości kątowe)
                      false, false, false]  # ax, ay, az
    odom0_queue_size: 5
    odom0_nodelay: false
    odom0_differential: false

    # IMU – surowe dane
    imu0: /imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  false, false]
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true